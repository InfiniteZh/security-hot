name: fetch-data

# Periodically re-run the security data fetchers and commit the
# refreshed JSON snapshots to a dedicated `data` branch. The web
# service deploys can then pull this branch (or read raw GitHub
# URLs) without needing its own network egress to every upstream.

on:
  schedule:
    # Hourly, on the :07 to dodge top-of-hour congestion on public APIs.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated fetcher subset (default = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false  # finishing a half-done snapshot beats clobbering it

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: uv sync
        run: uv sync --frozen

      - name: Restore prior snapshots
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
        continue-on-error: true  # branch may not exist on first run

      - name: Seed cache + history from data branch
        run: |
          if [ -d data-branch/backend ]; then
            cp -r data-branch/backend/cache backend/ 2>/dev/null || true
            cp -r data-branch/backend/history backend/ 2>/dev/null || true
          fi

      - name: Run fetchers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass via env, not direct interpolation — avoids shell injection
          # if someone supplies `--only "kev; curl evil"` via workflow_dispatch.
          ONLY_INPUT: ${{ inputs.only }}
        run: |
          set -euo pipefail
          # Whitelist allowed characters: lowercase letters, digits, comma, hyphen.
          # Reject anything else outright so weird input fails fast instead of
          # silently injecting into the command.
          if [ -n "${ONLY_INPUT:-}" ]; then
            if ! printf '%s' "$ONLY_INPUT" | grep -Eq '^[a-z0-9,_-]+$'; then
              echo "::error::invalid --only value (allowed: [a-z0-9,_-]+)"
              exit 1
            fi
            uv run python scripts/fetch_data.py --only "$ONLY_INPUT"
          else
            uv run python scripts/fetch_data.py
          fi

      - name: Push refreshed snapshots to data branch
        run: |
          cd data-branch || { mkdir data-branch && cd data-branch && git init -b data; }
          rm -rf backend && mkdir -p backend
          cp -r ../backend/cache backend/
          cp -r ../backend/history backend/
          git config user.name "security-hot-bot"
          git config user.email "bot@security-hot"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes; skipping commit"
          else
            git commit -m "data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:data
          fi
