services:
  web:
    build:
      context: .
      network: host
      args:
        # Proxy passthrough for build-time apt/uv only. Runtime UID is now
        # auto-detected by the entrypoint (adopts the cache-dir owner) — no
        # APP_UID build arg needed. Override with PUID/PGID env if you must.
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
    ports:
      - "8000:8000"
    # On Linux Docker, `host.docker.internal` does NOT resolve inside the
    # container by default — the in-process fetcher uses it as its HTTPS_PROXY
    # host (see .env), so without this mapping every RSS fetch dies with
    # "[Errno -2] Name or service not known". host-gateway routes the name to
    # the host. (Docker Desktop resolves it automatically; this is harmless there.)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      # Run the data pipeline in-process (no host crontab / sidecar needed).
      # Cadence is tunable via SECURITY_HOT_FETCH_NEWS_MINUTES / _PIPELINE_HOURS
      # / _FETCH_OTHER_HOURS / _BRIEF_HOUR_UTC — see .env.example.
      SECURITY_HOT_SCHEDULER_ENABLED: "1"
    volumes:
      # Persist the fetcher cache + history snapshots between container restarts.
      - ./backend/cache:/app/backend/cache
      - ./backend/history:/app/backend/history
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz').read()"]
      interval: 60s
      timeout: 5s
      retries: 3

  fetcher:
    # One-shot job: re-run with `docker compose run --rm fetcher` (or
    # schedule via host cron / a sidecar like ofelia).
    build:
      context: .
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
    profiles: ["job"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - ./backend/cache:/app/backend/cache
      - ./backend/history:/app/backend/history
    command: ["uv", "run", "python", "scripts/fetch_data.py"]
