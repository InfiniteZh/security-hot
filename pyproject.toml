[project]
name = "security-hot"
version = "0.1.0"
description = "Daily aggregator for security news, vulnerability intel, and papers."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "feedparser>=6.0",
  "pydantic>=2.6",
  "sentence-transformers>=3.0",
  "python-dotenv>=1.0",
  "apscheduler>=3.10,<4",
  "aiohttp>=3.9",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-httpx>=0.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = ["slow: tests that download large models or hit network (skip with -m 'not slow')"]
